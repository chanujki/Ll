<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="Rikuu — Next-gen Instant Messenger with 6-digit Chat ID">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/rikuu-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>Rikuu — Next Gen Messenger</title>
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- ============ AUTHENTICATION ============ -->
<section id="auth" class="auth">
  <div class="auth-glow ag1"></div>
  <div class="auth-glow ag2"></div>
  <div class="auth-card">
    <div class="auth-logo">R</div>
    <div class="auth-header">
      <h1>Rikuu</h1>
      <p>৬-সংখ্যার আইডি দিয়ে সুরক্ষিত ও প্রিমিয়াম চ্যাট</p>
    </div>
    
    <div class="seg-nav" role="tablist">
      <button id="tabSign" class="active">নতুন অ্যাকাউন্ট</button>
      <button id="tabLogin">লগইন</button>
    </div>

    <div id="signBox">
      <label class="field">
        <span>আপনার নাম</span>
        <input id="sName" maxlength="32" placeholder="যেমন: রাকিবুল হাসান" autocomplete="name">
      </label>
      <label class="field">
        <span>সিক্রেট পিন (৪–৬ সংখ্যা)</span>
        <input id="sPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
      </label>
      <div id="sErr" class="err" hidden></div>
      <button id="signBtn" class="primary" style="width:100%">অ্যাকাউন্ট খুলুন</button>
    </div>

    <div id="loginBox" hidden>
      <label class="field">
        <span>৬-সংখ্যার চ্যাট আইডি</span>
        <input id="lId" inputmode="numeric" maxlength="6" placeholder="যেমন: 582914">
      </label>
      <label class="field">
        <span>পিন নম্বর</span>
        <input id="lPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
      </label>
      <div id="lErr" class="err" hidden></div>
      <button id="loginBtn" class="primary" style="width:100%">লগইন করুন</button>
    </div>
  </div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" class="app" hidden>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <header class="side-head">
      <div id="profile" class="user-pill" title="প্রোফাইল সেটিংস"></div>
      <div class="side-tools">
        <button id="themeBtn" class="icon-btn" title="ডার্ক/লাইট থিম">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button id="logoutBtn" class="icon-btn" title="লগআউট">
          <svg class="icon" viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
        </button>
      </div>
    </header>

    <!-- ACTIVE HORIZONTAL STRIP -->
    <div id="storyStrip" class="story-strip"></div>

    <!-- SEARCH -->
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 3a6.5 6.5 0 0 1 5.25 10.35l4.7 4.7-1.42 1.42-4.7-4.7A6.5 6.5 0 1 1 9.5 3m0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
      <input id="search" placeholder="আইডি বা নাম দিয়ে খুঁজুন…" maxlength="20">
    </div>
    <div id="searchResults" style="padding: 0 12px;"></div>

    <!-- CHAT CONVERSATIONS LIST -->
    <div id="recent" class="chat-list"></div>
  </aside>

  <!-- CHAT MAIN VIEWPORT -->
  <main class="chat-view">
    <div id="empty" class="chat-empty">
      <div class="pulse-icon">💬</div>
      <h2>Rikuu স্পেসে স্বাগতম</h2>
      <p>যেকোনো বন্ধুকে চ্যাট তালিকা থেকে বেছে নিন অথবা নতুন আইডি দিয়ে কনভারসেশন শুরু করুন।</p>
    </div>

    <div id="convo" class="chat-active" hidden>
      <!-- TOPBAR -->
      <header class="chat-topbar">
        <button id="back" class="icon-btn back-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div id="headAvatar"></div>
        <div class="chat-user-detail">
          <b id="headName"></b>
          <span id="headStatus"></span>
        </div>
        <div style="display:flex; gap:6px;">
          <button id="audioBtn" class="icon-btn" title="অডিও কল">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </button>
          <button id="videoBtn" class="icon-btn" title="ভিডিও কল">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
        </div>
      </header>

      <!-- MESSAGES SCROLL CONTAINER -->
      <div id="messages" class="msg-container"></div>

      <!-- TYPING INDICATOR -->
      <div id="typing" class="typing-bar" hidden>
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <em>টাইপ করছেন…</em>
      </div>

      <!-- REPLY CAPSULE -->
      <div id="replyBar" class="quote-box" style="margin: 0 18px 4px;" hidden>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div><b id="replyName"></b>: <span id="replyText"></span></div>
          <button id="replyClose" class="icon-btn" style="width:24px;height:24px">✕</button>
        </div>
      </div>

      <!-- EMOJI DRAWER -->
      <div id="emojiPanel" class="emoji-drawer" hidden></div>

      <!-- VOICE RECORDING STATUS -->
      <div id="recBar" class="voice-rec-pill" style="margin: 0 18px 4px;" hidden>
        <div class="red-blink"></div>
        <span>রেকর্ডিং চলছে</span>
        <span id="recTime">00:00</span>
        <button id="recCancel" style="margin-left:auto; color:var(--danger)">বাতিল</button>
      </div>

      <!-- COMPOSER -->
      <div class="composer-area">
        <div class="composer-row">
          <button id="attach" class="icon-btn" title="ছবি">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/></svg>
          </button>
          <input id="imgInput" type="file" accept="image/*" hidden>
          <button id="emojiBtn" class="icon-btn" title="ইমোজি">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm3.5-9a1.5 1.5 0 1 0-1.5-1.5 1.5 1.5 0 0 0 1.5 1.5zm-7 0A1.5 1.5 0 1 0 7 9.5 1.5 1.5 0 0 0 8.5 11zm3.5 6.5a5.5 5.5 0 0 0 4.88-3h-9.76A5.5 5.5 0 0 0 12 17.5z"/></svg>
          </button>
          
          <textarea id="msg" class="composer-input" rows="1" placeholder="মেসেজ লিখুন (ডাবল ক্লিকে হার্ট)…"></textarea>
          
          <button id="micBtn" class="icon-btn" title="ভয়েস রেকর্ড">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
          </button>
          
          <button id="send" class="send-btn" title="পাঠান">
            <svg class="icon" viewBox="0 0 24 24" style="transform: rotate(45deg);"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ LIGHTBOX IMAGE VIEWER ============ -->
<div id="lightbox" class="lightbox" hidden>
  <button id="lbClose" class="icon-btn lightbox-close">✕</button>
  <img id="lbImg" src="" alt="প্রিভিউ">
</div>

<!-- ============ PROFILE MODAL ============ -->
<div id="profileModal" class="lightbox" hidden>
  <div class="auth-card" style="width: min(380px, 94vw);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="font-weight:700">প্রোফাইল তথ্য</h3>
      <button id="pmClose" class="icon-btn">✕</button>
    </div>
    <div id="pmAvatar" style="display:flex; justify-content:center; margin-bottom:12px;"></div>
    <button id="pmPhotoBtn" class="primary" style="margin: 0 auto 16px; padding: 6px 14px; font-size:0.8rem;">📷 ছবি পরিবর্তন</button>
    <input id="pmPhotoInput" type="file" accept="image/*" hidden>
    
    <label class="field"><span>নাম</span><input id="pmName" maxlength="32"></label>
    <label class="field"><span>বায়ো (Bio)</span><input id="pmBio" maxlength="80"></label>
    
    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--panel-hover); padding:10px 14px; border-radius:12px; margin-bottom:16px;">
      <span id="pmId" style="font-weight:700; color:var(--brand-primary)"></span>
      <button id="pmCopy" class="primary" style="padding:4px 10px; font-size:0.75rem;">কপি আইডি</button>
    </div>
    
    <div id="pmErr" class="err" hidden></div>
    <button id="pmSave" class="primary" style="width:100%">সংরক্ষণ করুন</button>
  </div>
</div>

<!-- ============ CALL OVERLAY ============ -->
<div id="call" class="call-hub" hidden>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-hud-top">
    <b id="callName" style="font-size:1.1rem; display:block"></b>
    <span id="callTitle" style="color:var(--text-muted); font-size:0.85rem"></span>
    <div id="callTimer" style="font-weight:700; margin-top:4px"></div>
  </div>
  <div class="call-actions-row">
    <button id="toggleMic" class="call-ctrl">🎙️</button>
    <button id="toggleCam" class="call-ctrl">📷</button>
    <button id="flipCam" class="call-ctrl">🔄</button>
    <button id="hangup" class="call-ctrl end">📵</button>
  </div>
</div>

<!-- ============ INCOMING CALL PROMPT ============ -->
<div id="incoming" class="lightbox" hidden>
  <div class="auth-card" style="text-align:center; width:300px;">
    <div id="incAvatar" style="display:flex; justify-content:center; margin-bottom:14px;"></div>
    <b id="incomingTitle" style="font-size:1.2rem; display:block"></b>
    <span id="incomingText" style="color:var(--text-muted); font-size:0.85rem"></span>
    <div style="display:flex; justify-content:center; gap:24px; margin-top:20px;">
      <button id="decline" class="call-ctrl end">✕</button>
      <button id="accept" class="call-ctrl" style="background:var(--online)">✓</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="app.js" defer></script>
</body>
</html>
